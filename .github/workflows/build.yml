name: Build

# One run per change: on pull requests, on main after a merge, or started by hand.
# (Before, every push to a PR branch ran twice: once for the push, once for the PR.)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-media-win.mjs
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: VibSync-Windows
          path: release/*.exe
          if-no-files-found: error
